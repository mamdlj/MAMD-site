<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FoodStock Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --text:#1c2433; --sub:#6b7686; --border:#e5e9f0;
  --primary:#2f6fed; --primary-d:#1f52c2; --green:#1fa970; --red:#e5484d; --orange:#f2994a; --blue:#2f6fed;
  --sidebar:#151b2d; --sidebar-text:#c7cede; --sidebar-active:#2f6fed;
  --shadow:0 2px 10px rgba(20,30,60,.06);
  --radius:14px;
}
:root[data-theme="dark"]{
  --bg:#0f131c; --panel:#161c29; --text:#e7ebf3; --sub:#8b93a7; --border:#242c3d;
  --sidebar:#0b0f18; --sidebar-text:#aab2c6;
  --shadow:0 2px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);transition:.2s}
button,input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1f2a44,#0f172a);padding:20px}
.login-card{background:var(--panel);width:100%;max-width:380px;border-radius:20px;padding:36px 30px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.login-logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#5b8def);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px}
.login-card h1{text-align:center;font-size:19px;margin:0 0 4px}
.login-card p{text-align:center;color:var(--sub);font-size:13px;margin:0 0 22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:14px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary)}
.btn{border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn-primary{background:var(--primary);color:#fff;width:100%}
.btn-primary:hover{background:var(--primary-d)}
.demo-hint{margin-top:16px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:11.5px;color:var(--sub);line-height:1.9}
.err{color:var(--red);font-size:12.5px;margin-top:6px;display:none}

/* APP SHELL */
#app{display:none}
.shell{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--sidebar);color:var(--sidebar-text);flex-shrink:0;display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh}
.sb-logo{display:flex;align-items:center;gap:10px;padding:6px 8px 20px;font-weight:800;color:#fff;font-size:15px}
.sb-logo span.ic{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#5b8def);display:flex;align-items:center;justify-content:center;font-size:16px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;margin-bottom:3px;color:var(--sidebar-text)}
.nav-item:hover{background:rgba(255,255,255,.06)}
.nav-item.active{background:var(--sidebar-active);color:#fff}
.nav-item .ic{width:18px;text-align:center}
.sb-bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
.sb-user{display:flex;align-items:center;gap:8px;padding:8px;font-size:12.5px}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.logout-btn{width:100%;margin-top:8px;background:rgba(229,72,77,.15);color:#ff8a8d;border:none;border-radius:9px;padding:9px;font-size:12.5px;cursor:pointer}

.main{flex:1;min-width:0;padding:20px 24px;max-width:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.topbar h2{margin:0;font-size:19px}
.topbar .sub{color:var(--sub);font-size:12.5px;margin-top:3px}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:var(--shadow);position:relative}
.badge-dot{position:absolute;top:5px;left:6px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--panel)}

.grid{display:grid;gap:14px}
.stat-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.stat-card{display:flex;justify-content:space-between;align-items:flex-start}
.stat-card .n{font-size:24px;font-weight:800;margin-top:6px}
.stat-card .l{color:var(--sub);font-size:12.5px}
.stat-ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px}
.two-col{grid-template-columns:1.4fr 1fr}
@media(max-width:900px){.two-col{grid-template-columns:1fr}.sidebar{position:fixed;z-index:50;transform:translateX(105%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{padding:16px}}
.menu-toggle{display:none}
@media(max-width:900px){.menu-toggle{display:flex}}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
.sb-overlay.show{display:block}
.card h3{margin:0 0 12px;font-size:14.5px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;color:var(--sub);font-weight:600;font-size:12px;padding:9px 8px;border-bottom:1.5px solid var(--border)}
td{padding:10px 8px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
.table-wrap{overflow-x:auto}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.pill-green{background:rgba(31,169,112,.13);color:var(--green)}
.pill-red{background:rgba(229,72,77,.13);color:var(--red)}
.pill-orange{background:rgba(242,153,74,.15);color:var(--orange)}
.pill-blue{background:rgba(47,111,237,.13);color:var(--blue)}
.pill-gray{background:rgba(120,130,150,.15);color:var(--sub)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text);font-size:13px}
.toolbar input{flex:1;min-width:160px}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);cursor:pointer;color:var(--text)}
.btn-sm.edit{color:var(--primary);border-color:var(--primary)}
.btn-sm.del{color:var(--red);border-color:var(--red)}
.btn-accent{background:var(--primary);color:#fff;border:none}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border-radius:16px;padding:22px;width:100%;max-width:480px;max-height:88vh;overflow:auto}
.modal h3{margin:0 0 16px}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notif-item{padding:10px 8px;border-bottom:1px solid var(--border);font-size:12.5px;display:flex;gap:8px}
.notif-item:last-child{border-bottom:none}
.section-hidden{display:none}
.food-tile{border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.food-emoji{font-size:30px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:9px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:12.5px}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:30px}
.big-btn{background:linear-gradient(135deg,var(--primary),#5b8def);color:#fff;border:none;border-radius:16px;padding:20px;font-size:16px;font-weight:700;width:100%;cursor:pointer;box-shadow:0 8px 20px rgba(47,111,237,.3)}
.progress{height:6px;background:var(--border);border-radius:6px;overflow:hidden;margin-top:6px}
.progress > div{height:100%;background:var(--primary)}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">🍽️</div>
    <h1>FoodStock Manager</h1>
    <p>سامانه مدیریت انبار، کارکنان و غذا</p>
    <div id="connStatus" style="text-align:center;font-size:11.5px;color:var(--sub);margin-bottom:14px">🔄 در حال اتصال به Firebase...</div>
    <div class="field"><label>نام کاربری</label><input id="loginUser" placeholder="مثلاً admin"></div>
    <div class="field"><label>رمز عبور</label><input id="loginPass" type="password" placeholder="••••••"></div>
    <div class="err" id="loginErr">نام کاربری یا رمز عبور اشتباه است</div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()" style="margin-top:6px" disabled>در حال اتصال...</button>
    <div class="demo-hint">
      کاربران آزمایشی — همه رمز: <b>1234</b><br>
      admin (مدیر سیستم) · anbardar (مسئول انبار)<br>
      ashpaz (مسئول آشپزخانه) · sara (کارمند)
    </div>
  </div>
</div>

<div id="app">
<div class="shell">
  <div class="sb-overlay" id="sbOverlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sb-logo"><span class="ic">🍽️</span> FoodStock</div>
    <div id="navItems"></div>
    <div class="sb-bottom">
      <div class="sb-user"><div class="sb-avatar" id="avatarTxt">?</div>
        <div><div id="sbName" style="color:#fff;font-weight:600"></div><div id="sbRole" style="opacity:.7"></div></div>
      </div>
      <button class="logout-btn" onclick="logout()">خروج از حساب</button>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div><h2 id="pageTitle">داشبورد</h2><div class="sub" id="pageSub">نمای کلی سیستم</div></div>
      <div class="top-actions">
        <button class="icon-btn menu-toggle" onclick="toggleSidebar()" title="منو">☰</button>
        <button class="icon-btn" onclick="toggleTheme()" title="حالت شب/روز">🌓</button>
        <button class="icon-btn" onclick="openNotif()" title="اعلان‌ها">🔔<span class="badge-dot" id="notifDot" style="display:none"></span></button>
      </div>
    </div>
    <div id="pageContent"></div>
  </div>
</div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>

<script>
/* ===================== DATA LAYER (localStorage = DB) ===================== */
const DB_KEY='fsm_db_v1';
function seed(){
  return {
    users:[
      {u:'admin',p:'1234',role:'admin',name:'مدیر سیستم'},
      {u:'anbardar',p:'1234',role:'inventory',name:'رضا کریمی'},
      {u:'ashpaz',p:'1234',role:'kitchen',name:'مریم احمدی'},
      {u:'sara',p:'1234',role:'staff',name:'سارا طاهری',empId:'E-1001'}
    ],
    employees:[
      {id:'E-1001',name:'سارا طاهری',code:'1001',phone:'0912xxxxxxx',dept:'فروش',pos:'کارشناس فروش',shift:'صبح',active:true,start:'1402/03/01',img:'👩'},
      {id:'E-1002',name:'محمد طاها',code:'1002',phone:'0935xxxxxxx',dept:'فنی',pos:'تکنسین',shift:'عصر',active:true,start:'1401/11/12',img:'👨'},
      {id:'E-1003',name:'نگار رستمی',code:'1003',phone:'0919xxxxxxx',dept:'اداری',pos:'کارمند اداری',shift:'صبح',active:true,start:'1403/01/20',img:'👩'},
      {id:'E-1004',name:'حسین یزدانی',code:'1004',phone:'0902xxxxxxx',dept:'انبار',pos:'انباردار',shift:'صبح',active:false,start:'1400/06/05',img:'👨'}
    ],
    inventory:[
      {id:'I-1',name:'برنج',code:'RCE-01',cat:'غلات',qty:12,unit:'کیلوگرم',min:20,price:850000,supplier:'بازرگانی نیک',expiry:'1404/12/01',loc:'انبار A'},
      {id:'I-2',name:'روغن',code:'OIL-02',cat:'روغن',qty:40,unit:'لیتر',min:10,price:1200000,supplier:'روغن طلایی',expiry:'1404/09/15',loc:'انبار A'},
      {id:'I-3',name:'مرغ',code:'MET-03',cat:'گوشت',qty:35,unit:'کیلوگرم',min:15,price:1450000,supplier:'مرغداری پارس',expiry:'1403/10/28',loc:'سردخانه'},
      {id:'I-4',name:'گوشت گوسفندی',code:'MET-04',cat:'گوشت',qty:8,unit:'کیلوگرم',min:10,price:5200000,supplier:'دام‌پروری البرز',expiry:'1403/10/22',loc:'سردخانه'},
      {id:'I-5',name:'سیب‌زمینی',code:'VEG-05',cat:'سبزیجات',qty:60,unit:'کیلوگرم',min:15,price:280000,supplier:'باغ سبز',expiry:'1404/11/01',loc:'انبار B'},
      {id:'I-6',name:'پیاز',code:'VEG-06',cat:'سبزیجات',qty:25,unit:'کیلوگرم',min:10,price:260000,supplier:'باغ سبز',expiry:'1404/11/01',loc:'انبار B'},
      {id:'I-7',name:'نوشابه',code:'BEV-07',cat:'نوشیدنی',qty:5,unit:'عدد',min:20,price:150000,supplier:'پخش مرکزی',expiry:'1405/03/01',loc:'انبار A'}
    ],
    transactions:[],
    foods:[
      {id:'F-1',name:'چلو مرغ',desc:'برنج ایرانی با مرغ گریل شده',price:1200000,type:'اصلی',active:true,img:'🍗',ingredients:[{item:'I-3',qty:0.3},{item:'I-1',qty:0.25}]},
      {id:'F-2',name:'قورمه‌سبزی',desc:'خورش سنتی با گوشت گوسفندی',price:1350000,type:'اصلی',active:true,img:'🍲',ingredients:[{item:'I-4',qty:0.2},{item:'I-1',qty:0.2}]},
      {id:'F-3',name:'غذای گیاهی',desc:'سبزیجات بخارپز با برنج',price:900000,type:'گیاهی',active:true,img:'🥗',ingredients:[{item:'I-5',qty:0.3},{item:'I-6',qty:0.1}]},
      {id:'F-4',name:'ساندویچ صبحانه',desc:'تخم‌مرغ و پنیر',price:450000,type:'صبحانه',active:true,img:'🥪',ingredients:[]}
    ],
    menu:{ // day -> meal -> [foodIds]
      'شنبه':{'صبحانه':['F-4'],'ناهار':['F-1','F-2','F-3'],'شام':['F-3']},
      'یکشنبه':{'صبحانه':['F-4'],'ناهار':['F-1','F-3'],'شام':['F-2']},
      'دوشنبه':{'صبحانه':['F-4'],'ناهار':['F-2','F-3'],'شام':['F-1']}
    },
    requests:[
      {id:'REQ-1001',empId:'E-1002',empName:'محمد طاها',foodId:'F-1',foodName:'چلو مرغ',meal:'ناهار',qty:1,date:today(),time:'11:40',status:'تأیید شد',note:''},
      {id:'REQ-1002',empId:'E-1003',empName:'نگار رستمی',foodId:'F-2',foodName:'قورمه‌سبزی',meal:'ناهار',qty:1,date:today(),time:'11:52',status:'در انتظار تأیید',note:''}
    ],
    activity:[{t:nowTime(),msg:'سیستم راه‌اندازی شد'}]
  };
}
function today(){const d=new Date();return d.toLocaleDateString('fa-IR');}
function nowTime(){const d=new Date();return d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});}
/* ===================== FIREBASE / FIRESTORE ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyDbehUT1Q8ejdC_s7GaGDDqSMIwltKofbI",
  authDomain: "foodstock-manager-e33ed.firebaseapp.com",
  projectId: "foodstock-manager-e33ed",
  storageBucket: "foodstock-manager-e33ed.firebasestorage.app",
  messagingSenderId: "400375301624",
  appId: "1:400375301624:web:ee7972a363adaf8f8d820d"
};
firebase.initializeApp(firebaseConfig);
const fsDB = firebase.firestore();
const fsDoc = fsDB.collection('foodstock').doc('main-db');

async function loadDB(){
  try{
    const snap = await fsDoc.get();
    if(snap.exists && snap.data().payload){
      DB = JSON.parse(snap.data().payload);
    }else{
      DB = seed();
      await fsDoc.set({payload: JSON.stringify(DB), updatedAt: new Date().toISOString()});
    }
    localStorage.setItem(DB_KEY, JSON.stringify(DB)); // offline cache
  }catch(err){
    console.error('اتصال به Firestore ناموفق بود، از حافظه محلی استفاده می‌شود:', err);
    const cached = localStorage.getItem(DB_KEY);
    DB = cached ? JSON.parse(cached) : seed();
  }
}
let saveTimer=null;
function saveDB(){
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    fsDoc.set({payload: JSON.stringify(DB), updatedAt: new Date().toISOString()})
      .catch(err=>console.error('ذخیره در Firestore ناموفق بود:', err));
  },400);
}
let DB=null;
function log(msg){DB.activity.unshift({t:nowTime(),msg});DB.activity=DB.activity.slice(0,30);}
function uid(p){return p+'-'+Math.floor(1000+Math.random()*9000);}

/* ===================== AUTH ===================== */
let CUR=null;
function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value.trim();
  const found=DB.users.find(x=>x.u===u&&x.p===p);
  if(!found){document.getElementById('loginErr').style.display='block';return;}
  CUR=found;sessionStorage.setItem('fsm_cur',JSON.stringify(found));
  boot();
}
function logout(){CUR=null;sessionStorage.removeItem('fsm_cur');document.getElementById('app').style.display='none';document.getElementById('loginScreen').style.display='flex';}
const cached=sessionStorage.getItem('fsm_cur'); if(cached){CUR=JSON.parse(cached);}

/* ===================== NAV / ROLES ===================== */
const NAVS={
  admin:[['dashboard','📊','داشبورد'],['employees','👥','کارکنان'],['inventory','📦','انبار'],['transactions','🔁','ورود و خروج انبار'],['foods','🍱','غذاها / منو'],['menu','📅','منوی روزانه'],['requests','📝','درخواست‌های غذا'],['kitchen','👩‍🍳','پنل آشپزخانه'],['reports','📈','گزارش‌ها'],['users','🔐','کاربران و دسترسی‌ها']],
  inventory:[['dashboard','📊','داشبورد'],['inventory','📦','انبار'],['transactions','🔁','ورود و خروج انبار'],['reports','📈','گزارش‌ها']],
  kitchen:[['dashboard','📊','داشبورد'],['kitchen','👩‍🍳','پنل آشپزخانه'],['requests','📝','درخواست‌های غذا'],['menu','📅','منوی روزانه']],
  staff:[['staffhome','🏠','خانه'],['myrequests','📝','درخواست‌های من']]
};
let CURRENT_PAGE=null;
function boot(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('avatarTxt').textContent=CUR.name[0];
  document.getElementById('sbName').textContent=CUR.name;
  const roleLabel={admin:'مدیر سیستم',inventory:'مسئول انبار',kitchen:'مسئول آشپزخانه',staff:'کارمند'};
  document.getElementById('sbRole').textContent=roleLabel[CUR.role];
  const navHtml=NAVS[CUR.role].map(n=>`<div class="nav-item" data-p="${n[0]}" onclick="goPage('${n[0]}')"><span class="ic">${n[1]}</span>${n[2]}</div>`).join('');
  document.getElementById('navItems').innerHTML=navHtml;
  goPage(CUR.role==='staff'?'staffhome':'dashboard');
}
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sbOverlay').classList.toggle('show');
}
function goPage(p){
  CURRENT_PAGE=p;
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sbOverlay').classList.remove('show');
  document.querySelectorAll('.nav-item').forEach(e=>e.classList.toggle('active',e.dataset.p===p));

function lowStockItems(){return DB.inventory.filter(i=>i.qty<i.min);}
function expiringItems(){return DB.inventory.slice(0,3);} // demo: highlight first few as "near expiry" indicator style
function fmt(n){return Number(n).toLocaleString('fa-IR');}
function statusPill(s){
  const map={'در انتظار تأیید':'pill-orange','تأیید شد':'pill-blue','در حال آماده‌سازی':'pill-blue','آماده تحویل':'pill-green','تحویل داده شد':'pill-green','رد شد':'pill-red'};
  return `<span class="pill ${map[s]||'pill-gray'}">${s}</span>`;
}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modalBg').style.display='flex';}

/* ===================== NOTIFICATIONS ===================== */
function buildNotifs(){
  const list=[];
  lowStockItems().forEach(i=>list.push({c:'🔴',t:`موجودی ${i.name} کمتر از حد مجاز است (${fmt(i.qty)} ${i.unit})`}));
  const pend=DB.requests.filter(r=>r.status==='در انتظار تأیید').length;
  if(pend>0)list.push({c:'🔵',t:`${fmt(pend)} درخواست غذای جدید در انتظار تأیید است`});
  DB.requests.filter(r=>r.status==='تأیید شد').slice(0,2).forEach(r=>list.push({c:'🟢',t:`درخواست غذای ${r.empName} تأیید شد`}));
  return list;
}
function refreshNotifDot(){document.getElementById('notifDot').style.display=buildNotifs().length?'block':'none';}
function openNotif(){
  const n=buildNotifs();
  openModal(`<h3>🔔 اعلان‌ها</h3>${n.length?n.map(x=>`<div class="notif-item"><span>${x.c}</span><span>${x.t}</span></div>`).join(''):'<div class="empty">اعلان جدیدی وجود ندارد</div>'}
  <div class="modal-actions"><button class="btn-sm" onclick="closeModal()" style="flex:1">بستن</button></div>`);
}

function renderTransactions(){

  <div class="toolbar"><button class="btn-sm btn-accent" onclick="openTxForm('in')">+ ثبت ورود کالا</button><button class="btn-sm" style="border-color:var(--red);color:var(--red)" onclick="openTxForm('out')">+ ثبت خروج کالا</button></div>
  <div class="card"><h3>تراکنش‌های انبار</h3><div class="table-wrap"><table><tr><th>نوع</th><th>کالا</th><th>مقدار</th><th>تاریخ</th><th>توضیحات</th></tr>
  ${DB.transactions.slice().reverse().map(t=>`<tr><td>${t.type==='in'?'<span class="pill pill-green">ورود</span>':'<span class="pill pill-red">خروج</span>'}</td><td>${t.itemName}</td><td>${fmt(t.qty)} ${t.unit}</td><td>${t.date}</td><td>${t.note||'-'}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">تراکنشی ثبت نشده</div></td></tr>'}</table></div></div>`;
}
function openTxForm(type){
  const opts=DB.inventory.map(i=>`<option value="${i.id}">${i.name} (موجودی: ${fmt(i.qty)} ${i.unit})</option>`).join('');
  openModal(`<h3>${type==='in'?'ثبت ورود کالا':'ثبت خروج کالا'}</h3>
  <div class="field"><label>کالا</label><select id="tx_item">${opts}</select></div>
  <div class="form-row"><div class="field"><label>مقدار</label><input id="tx_qty" type="number" value="1"></div>
  <div class="field"><label>${type==='in'?'تأمین‌کننده':'علت خروج / بخش'}</label><input id="tx_extra"></div></div>
  ${type==='in'?'<div class="field"><label>شماره فاکتور</label><input id="tx_inv"></div>':''}
  <div class="field"><label>توضیحات</label><textarea id="tx_note" rows="2"></textarea></div>
  <div class="modal-actions"><button class="btn-sm" style="flex:1" onclick="closeModal()">انصراف</button><button class="btn-sm btn-accent" style="flex:1" onclick="saveTx('${type}')">ثبت تراکنش</button></div>`);
}
function saveTx(type){
  const itemId=document.getElementById('tx_item').value;
  const qty=+document.getElementById('tx_qty').value||0;
  const item=DB.inventory.find(i=>i.id===itemId);
  if(qty<=0){alert('مقدار نامعتبر است');return;}
  if(type==='out'&&qty>item.qty){alert('موجودی کافی نیست');return;}
  item.qty += type==='in'?qty:-qty;
  DB.transactions.push({id:uid('TX'),type,itemName:item.name,unit:item.unit,qty,date:today(),note:document.getElementById('tx_note').value.trim()});
  log(`${type==='in'?'ورود':'خروج'} ${fmt(qty)} ${item.unit} ${item.name} ثبت شد`);
  saveDB();closeModal();renderTransactions();
}

  <div class="form-row"><div class="field"><label>قیمت (ریال)</label><input id="f_price" type="number" value="${f.price}"></div><div class="field"><label>نوع غذا</label><select id="f_type"><option ${f.type=='اصلی'?'selected':''}>اصلی</option><option ${f.type=='گیاهی'?'selected':''}>گیاهی</option><option ${f.type=='صبحانه'?'selected':''}>صبحانه</option><option ${f.type=='دسر'?'selected':''}>دسر</option></select></div></div>
  <div class="form-row"><div class="field"><label>ایموجی/تصویر</label><input id="f_img" value="${f.img}"></div><div class="field"><label>وضعیت</label><select id="f_active"><option value="1" ${f.active?'selected':''}>فعال</option><option value="0" ${!f.active?'selected':''}>غیرفعال</option></select></div></div>
  <div class="modal-actions"><button class="btn-sm" style="flex:1" onclick="closeModal()">انصراف</button><button class="btn-sm btn-accent" style="flex:1" onclick="saveFood('${f.id}',${!id})">ذخیره</button></div>`);
}
function saveFood(id,isNew){
  const name=document.getElementById('f_name').value.trim();
  if(!name){alert('نام غذا الزامی است');return;}
  const data={id,name,desc:document.getElementById('f_desc').value.trim(),price:+document.getElementById('f_price').value||0,type:document.getElementById('f_type').value,img:document.getElementById('f_img').value.trim()||'🍽️',active:document.getElementById('f_active').value==='1',ingredients:isNew?[]:DB.foods.find(x=>x.id===id).ingredients};
  if(isNew)DB.foods.push(data);else DB.foods=DB.foods.map(f=>f.id===id?{...f,...data}:f);
  log(`غذای «${name}» ${isNew?'ثبت':'ویرایش'} شد`);saveDB();closeModal();renderFoods();
}
function delFood(id){if(!confirm('غذا حذف شود؟'))return;DB.foods=DB.foods.filter(f=>f.id!==id);saveDB();renderFoodGrid();}

/* ===================== DAILY MENU ===================== */
const DAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const MEALS=['صبحانه','ناهار','شام'];
let menuDay=DAYS[0];
function renderMenu(){
  document.getElementById('pageContent').innerHTML=`
  <div class="tabs">${DAYS.map(d=>`<div class="tab ${d===menuDay?'active':''}" onclick="menuDay='${d}';renderMenu()">${d}</div>`).join('')}</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
  ${MEALS.map(m=>{
    DB.menu[menuDay]=DB.menu[menuDay]||{};
    const foodIds=DB.menu[menuDay][m]||[];
    return `<div class="card"><h3>${m}</h3>
    ${foodIds.map(fid=>{const f=DB.foods.find(x=>x.id===fid);return f?`<div class="notif-item">${f.img} <span>${f.name}</span><span style="margin-right:auto;cursor:pointer;color:var(--red)" onclick="removeMenuFood('${m}','${fid}')">✕</span></div>`:'';}).join('')||'<div class="empty" style="padding:10px">غذایی تعیین نشده</div>'}
    ${CUR.role==='admin'?`<select style="width:100%;margin-top:8px;padding:8px;border:1.5px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)" onchange="if(this.value){addMenuFood('${m}',this.value);this.value=''}"><option value="">+ افزودن غذا</option>${DB.foods.filter(f=>f.active).map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}</select>`:''}
    </div>`;
  }).join('')}
  </div>`;
}
function addMenuFood(meal,fid){DB.menu[menuDay][meal]=DB.menu[menuDay][meal]||[];if(!DB.menu[menuDay][meal].includes(fid))DB.menu[menuDay][meal].push(fid);saveDB();renderMenu();}
function removeMenuFood(meal,fid){DB.menu[menuDay][meal]=DB.menu[menuDay][meal].filter(x=>x!==fid);saveDB();renderMenu();}

/* ===================== REQUESTS (admin/kitchen view) ===================== */
function renderRequests(){
  document.getElementById('pageContent').innerHTML=`
  <div class="card"><h3>درخواست‌های غذا</h3><div class="table-wrap"><table><tr><th>شماره</th><th>نام</th><th>منطقه</th><th>کد پرسنلی</th><th>غذا</th><th>وعده</th><th>تاریخ</th><th>ساعت</th><th>وضعیت</th><th>عملیات</th></tr>
  ${DB.requests.slice().reverse().map(r=>`<tr><td>${r.id}</td><td>${r.empName}</td><td>${r.region||'-'}</td><td>${empCode(r.empId)}</td><td>${r.foodName}</td><td>${r.meal}</td><td>${r.date}</td><td>${r.time}</td><td>${statusPill(r.status)}</td>
  <td>${nextStatusBtn(r)}</td></tr>`).join('')||'<tr><td colspan="10"><div class="empty">درخواستی ثبت نشده</div></td></tr>'}</table></div></div>`;
}
function empCode(id){const e=DB.employees.find(x=>x.id===id);return e?e.code:'-';}
const FLOW=['در انتظار تأیید','تأیید شد','در حال آماده‌سازی','آماده تحویل','تحویل داده شد'];
function nextStatusBtn(r){
  const idx=FLOW.indexOf(r.status);
  if(idx<0||idx===FLOW.length-1)return '<span style="color:var(--sub);font-size:12px">-</span>';
  return `<button class="btn-sm btn-accent" onclick="advanceReq('${r.id}')">→ ${FLOW[idx+1]}</button>`;
}
function advanceReq(id){
  const r=DB.requests.find(x=>x.id===id);
  const idx=FLOW.indexOf(r.status);
  if(idx<FLOW.length-1){r.status=FLOW[idx+1];log(`وضعیت درخواست ${r.id} به «${r.status}» تغییر یافت`);saveDB();(CURRENT_PAGE==='kitchen'?renderKitchen:renderRequests)();}
}

/* ===================== KITCHEN PANEL ===================== */
function renderKitchen(){
  const todays=DB.requests.filter(r=>r.date===today());
  const byMeal={};
  MEALS.forEach(m=>byMeal[m]={});
  todays.forEach(r=>{byMeal[r.meal][r.foodName]=(byMeal[r.meal][r.foodName]||0)+r.qty;});
  const shortages=DB.inventory.filter(i=>i.qty<i.min);
  document.getElementById('pageContent').innerHTML=`
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
  ${MEALS.map(m=>`<div class="card"><h3>${m} امروز</h3>
  ${Object.keys(byMeal[m]).length?Object.entries(byMeal[m]).map(([f,q])=>`<div class="notif-item">🍽️ <span>${f}: <b>${fmt(q)} پرس</b></span></div>`).join(''):'<div class="empty">سفارشی ثبت نشده</div>'}</div>`).join('')}
  </div>
  <div class="card" style="margin-top:14px"><h3>⚠️ کمبود مواد اولیه</h3>
  ${shortages.length?shortages.map(i=>`<div class="notif-item">⚠️ <span>${i.name} کافی نیست — موجودی: ${fmt(i.qty)} ${i.unit} / حداقل: ${fmt(i.min)} ${i.unit}
  <button class="btn-sm" style="margin-right:10px" onclick="createSupplyReq('${i.id}')">ایجاد درخواست تأمین</button></span></div>`).join(''):'<div class="empty">کمبودی گزارش نشده</div>'}
  </div>
  <div class="card" style="margin-top:14px"><h3>📋 صف درخواست‌های در حال پردازش</h3>
  ${reqMiniTable(DB.requests.filter(r=>['تأیید شد','در حال آماده‌سازی'].includes(r.status)))}
  </div>`;
}
function createSupplyReq(itemId){const i=DB.inventory.find(x=>x.id===itemId);log(`درخواست تأمین برای «${i.name}» ثبت شد`);saveDB();alert('درخواست تأمین برای '+i.name+' ثبت شد.');}

/* ===================== REPORTS ===================== */
function renderReports(){
  document.getElementById('pageContent').innerHTML=`
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">
  ${[['گزارش موجودی انبار','inv'],['گزارش ورود/خروج کالا','tx'],['گزارش درخواست‌های غذا','req'],['گزارش کارکنان','emp']].map(r=>`
  <div class="card"><h3>${r[0]}</h3><div style="display:flex;gap:6px"><button class="btn-sm btn-accent" onclick="exportCSV('${r[1]}')">خروجی CSV</button><button class="btn-sm" onclick="exportCSV('${r[1]}')">خروجی Excel</button></div></div>`).join('')}
  </div>
  <div class="card" style="margin-top:14px"><h3>📊 خلاصه مصرف و هزینه</h3>
  <p style="font-size:13px;color:var(--sub)">جمع درخواست‌های ثبت‌شده: <b style="color:var(--text)">${fmt(DB.requests.length)}</b> · جمع ارزش انبار: <b style="color:var(--text)">${fmt(DB.inventory.reduce((s,i)=>s+i.qty*i.price,0))} ﷼</b></p>
  <canvas id="repChart" height="110"></canvas></div>`;
  new Chart(document.getElementById('repChart'),{type:'bar',data:{labels:DB.foods.map(f=>f.name),datasets:[{label:'تعداد درخواست',data:DB.foods.map(f=>DB.requests.filter(r=>r.foodId===f.id).length),backgroundColor:'#1fa970'}]},options:{plugins:{legend:{display:false}}}});
}
function exportCSV(kind){
  let rows=[],name='report.csv';
  if(kind==='inv'){rows=[['نام','کد','دسته','موجودی','واحد','حداقل','قیمت','تأمین‌کننده','انقضا']];DB.inventory.forEach(i=>rows.push([i.name,i.code,i.cat,i.qty,i.unit,i.min,i.price,i.supplier,i.expiry]));name='inventory.csv';}
  if(kind==='tx'){rows=[['نوع','کالا','مقدار','تاریخ','توضیحات']];DB.transactions.forEach(t=>rows.push([t.type,t.itemName,t.qty,t.date,t.note]));name='transactions.csv';}
  if(kind==='req'){rows=[['شماره','کارمند','غذا','وعده','تاریخ','وضعیت']];DB.requests.forEach(r=>rows.push([r.id,r.empName,r.foodName,r.meal,r.date,r.status]));name='requests.csv';}
  if(kind==='emp'){rows=[['نام','کد','واحد','سمت','شیفت','وضعیت']];DB.employees.forEach(e=>rows.push([e.name,e.code,e.dept,e.pos,e.shift,e.active?'فعال':'غیرفعال']));name='employees.csv';}
  const csv='\uFEFF'+rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
}

/* ===================== USERS & ACCESS (admin only) ===================== */
const ROLE_LABEL={admin:'مدیر سیستم',inventory:'مسئول انبار',kitchen:'مسئول آشپزخانه',staff:'کارمند'};
function renderUsers(){
  document.getElementById('pageContent').innerHTML=`
  <div class="toolbar"><input id="userSearch" placeholder="جستجوی نام کاربری..." oninput="renderUsersTable()"><button class="btn-sm btn-accent" onclick="openUserForm()">+ افزودن کاربر</button></div>
  <div class="card"><div id="userTableWrap"></div></div>`;
  renderUsersTable();
}
function renderUsersTable(){
  const q=(document.getElementById('userSearch')?.value||'').trim();
  const list=DB.users.filter(u=>!q||u.u.includes(q)||u.name.includes(q));
  document.getElementById('userTableWrap').innerHTML=`<div class="table-wrap"><table><tr><th>نام</th><th>نام کاربری</th><th>نقش</th><th>کارمند مرتبط</th><th>عملیات</th></tr>
  ${list.map(u=>`<tr><td>${u.name}</td><td>${u.u}</td><td><span class="pill pill-blue">${ROLE_LABEL[u.role]}</span></td><td>${u.empId?(DB.employees.find(e=>e.id===u.empId)?.name||'-'):'-'}</td>
  <td><button class="btn-sm edit" onclick="openUserForm('${u.u}')">ویرایش</button> ${u.u!==CUR.u?`<button class="btn-sm del" onclick="delUser('${u.u}')">حذف</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">کاربری یافت نشد</div></td></tr>'}</table></div>`;
}
function openUserForm(uname){
  const u=uname?DB.users.find(x=>x.u===uname):{u:'',p:'',role:'staff',name:'',empId:''};
  const empOpts=DB.employees.map(e=>`<option value="${e.id}" ${u.empId===e.id?'selected':''}>${e.name} (${e.code})</option>`).join('');
  openModal(`<h3>${uname?'ویرایش':'افزودن'} کاربر</h3>
  <div class="field"><label>نام کامل</label><input id="u_name" value="${u.name}"></div>
  <div class="form-row"><div class="field"><label>نام کاربری</label><input id="u_user" value="${u.u}" ${uname?'disabled':''}></div><div class="field"><label>رمز عبور</label><input id="u_pass" type="text" placeholder="${uname?'خالی = بدون تغییر':''}" value="${uname?'':'1234'}"></div></div>
  <div class="field"><label>نقش</label><select id="u_role" onchange="document.getElementById('u_emp_wrap').style.display=this.value==='staff'?'block':'none'">
    <option value="admin" ${u.role=='admin'?'selected':''}>مدیر سیستم</option>
    <option value="inventory" ${u.role=='inventory'?'selected':''}>مسئول انبار</option>
    <option value="kitchen" ${u.role=='kitchen'?'selected':''}>مسئول آشپزخانه</option>
    <option value="staff" ${u.role=='staff'?'selected':''}>کارمند</option>
  </select></div>
  <div class="field" id="u_emp_wrap" style="display:${u.role==='staff'?'block':'none'}"><label>کارمند مرتبط</label><select id="u_emp"><option value="">— بدون اتصال —</option>${empOpts}</select></div>
  <div class="modal-actions"><button class="btn-sm" style="flex:1" onclick="closeModal()">انصراف</button><button class="btn-sm btn-accent" style="flex:1" onclick="saveUser('${uname||''}')">ذخیره</button></div>`);
}
function saveUser(oldUname){
  const isNew=!oldUname;
  const uname=isNew?document.getElementById('u_user').value.trim():oldUname;
  const name=document.getElementById('u_name').value.trim();
  if(!uname||!name){alert('نام و نام کاربری الزامی است');return;}
  if(isNew&&DB.users.some(x=>x.u===uname)){alert('این نام کاربری قبلاً استفاده شده است');return;}
  const pass=document.getElementById('u_pass').value.trim();
  const role=document.getElementById('u_role').value;
  const empId=role==='staff'?document.getElementById('u_emp').value:'';
  if(isNew){
    DB.users.push({u:uname,p:pass||'1234',role,name,empId});
  }else{
    const u=DB.users.find(x=>x.u===uname);
    u.name=name;u.role=role;u.empId=empId;
    if(pass)u.p=pass;
  }
  log(`حساب کاربری «${name}» ${isNew?'ایجاد':'ویرایش'} شد`);saveDB();closeModal();renderUsers();
}
function delUser(uname){
  if(uname===CUR.u){alert('نمی‌توانید حساب خودتان را حذف کنید');return;}
  if(!confirm('این حساب کاربری حذف شود؟'))return;
  DB.users=DB.users.filter(x=>x.u!==uname);saveDB();renderUsersTable();
}

/* ===================== STAFF VIEWS ===================== */
function getMyEmp(){return DB.employees.find(e=>e.id===CUR.empId);}
function renderStaffHome(){
  const me=getMyEmp();
  const day=DAYS[new Date().getDay()===6?0:new Date().getDay()+1]||DAYS[0]; // rough mapping
  const todayMenu=DB.menu[menuDay]||DB.menu[DAYS[0]];
  const myCurrent=DB.requests.filter(r=>r.empId===CUR.empId&&!['تحویل داده شد','رد شد'].includes(r.status));
  document.getElementById('pageContent').innerHTML=`
  <div class="card" style="margin-bottom:14px"><h3>🍽️ منوی امروز (${menuDay})</h3>
  ${MEALS.map(m=>`<div style="margin-bottom:8px"><b style="font-size:12.5px;color:var(--sub)">${m}</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
  ${(todayMenu[m]||[]).map(fid=>{const f=DB.foods.find(x=>x.id===fid);return f?`<span class="pill pill-blue">${f.img} ${f.name}</span>`:'';}).join('')||'<span class="empty" style="padding:0">-</span>'}
  </div></div>`).join('')}
  </div>
  <button class="big-btn" onclick="goPage('myrequests');openReqForm()">🍽️ درخواست غذا</button>
  <div class="grid two-col" style="margin-top:14px">
    <div class="card"><h3>درخواست فعلی من</h3>${reqMiniTable(myCurrent)}</div>
    <div class="card"><h3>🔔 اعلان‌ها</h3>${buildNotifs().map(x=>`<div class="notif-item">${x.c}<span>${x.t}</span></div>`).join('')||'<div class="empty">اعلانی نیست</div>'}</div>
  </div>`;
}
function renderMyRequests(){
  const mine=DB.requests.filter(r=>r.empId===CUR.empId);
  document.getElementById('pageContent').innerHTML=`
  <div class="toolbar"><button class="btn-sm btn-accent" onclick="openReqForm()">+ درخواست غذای جدید</button></div>
  <div class="card"><h3>تاریخچه درخواست‌های من</h3>${reqMiniTable(mine.slice().reverse())}</div>`;
}
function openReqForm(){
  const dayMenu=DB.menu[menuDay]||{};
  const me=getMyEmp();
  const regions=['تهران - مرکزی','تهران - غرب','تهران - شرق','تهران - شمال','تهران - جنوب','کرج','سایر'];
  openModal(`<h3>🍽️ درخواست غذا — ${menuDay}</h3>
  <div class="form-row"><div class="field"><label>نام</label><input id="rq_name" value="${me?me.name:CUR.name}"></div>
  <div class="field"><label>منطقه</label><select id="rq_region">${regions.map(r=>`<option>${r}</option>`).join('')}</select></div></div>
  <div class="field"><label>وعده</label><select id="rq_meal" onchange="fillFoodOpts()">${MEALS.map(m=>`<option ${!(dayMenu[m]||[]).length?'disabled':''}>${m}</option>`).join('')}</select></div>
  <div class="field"><label>غذا</label><select id="rq_food"></select></div>
  <div class="field"><label>تعداد</label><input id="rq_qty" type="number" value="1" min="1"></div>
  <div class="field"><label>توضیحات (اختیاری)</label><textarea id="rq_note" rows="2"></textarea></div>
  <div class="modal-actions"><button class="btn-sm" style="flex:1" onclick="closeModal()">انصراف</button><button class="btn-sm btn-accent" style="flex:1" onclick="submitReq()">ثبت درخواست</button></div>`);
  fillFoodOpts();
}
function fillFoodOpts(){
  const meal=document.getElementById('rq_meal').value;
  const ids=(DB.menu[menuDay]||{})[meal]||[];
  document.getElementById('rq_food').innerHTML=ids.map(fid=>{const f=DB.foods.find(x=>x.id===fid);return f?`<option value="${fid}">${f.img} ${f.name}</option>`:'';}).join('')||'<option disabled>غذایی موجود نیست</option>';
}
function submitReq(){
  const meal=document.getElementById('rq_meal').value;
  const foodId=document.getElementById('rq_food').value;
  const food=DB.foods.find(f=>f.id===foodId);
  if(!food){alert('لطفاً غذا را انتخاب کنید');return;}
  const name=document.getElementById('rq_name').value.trim();
  if(!name){alert('لطفاً نام را وارد کنید');return;}
  const me=getMyEmp();
  const r={id:uid('REQ'),empId:CUR.empId,empName:name,region:document.getElementById('rq_region').value,foodId,foodName:food.name,meal,qty:+document.getElementById('rq_qty').value||1,date:today(),time:nowTime(),status:'در انتظار تأیید',note:document.getElementById('rq_note').value.trim()};
  DB.requests.push(r);log(`درخواست غذای جدید از ${r.empName} (${r.region}) ثبت شد`);saveDB();closeModal();
  (CURRENT_PAGE==='staffhome'?renderStaffHome:renderMyRequests)();
}

  const root=document.documentElement;
  const cur=root.getAttribute('data-theme');

}
