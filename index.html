<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FoodStock Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#07111f,#102a43);color:#fff;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(760px,100%);padding:48px;border:1px solid rgba(255,255,255,.14);border-radius:28px;background:rgba(255,255,255,.07);backdrop-filter:blur(16px);box-shadow:0 24px 80px rgba(0,0,0,.35);text-align:center}
.badge{display:inline-block;padding:8px 14px;border-radius:999px;background:rgba(80,200,160,.14);color:#73e6bd;font-size:14px;margin-bottom:18px}
h1{font-size:clamp(34px,7vw,58px);margin:0 0 14px}p{color:#b9c7d8;line-height:1.9;font-size:17px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
a{display:inline-block;text-decoration:none;padding:13px 22px;border-radius:12px;font-weight:700}
.primary{background:#fff;color:#07111f}.secondary{border:1px solid rgba(255,255,255,.2);color:#fff}
small{display:block;color:#8090a5;margin-top:28px}
</style>
</head>
<body>
<main class="card">
<div class="badge">FoodStock Manager</div>
<h1>مدیریت هوشمند رستوران</h1>
<p>مدیریت محصولات، سفارش‌ها، موجودی و کاربران در یک سیستم یکپارچه.</p>
<div class="actions">
<a class="primary" href="https://github.com/mamdlj/MAMD-site">مشاهده پروژه در GitHub</a>
<a class="secondary" href="https://github.com/mamdlj/MAMD-site/tree/main">کد پروژه</a>
</div>
<small>این صفحه نسخه‌ی نمایش GitHub Pages است؛ اپلیکیشن کامل با Next.js اجرا می‌شود.</small>
</main>
</body>
</html>
