name: Deploy Firebase

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-firestore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Firestore rules and indexes
        if: ${{ secrets.FIREBASE_TOKEN != '' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx firebase-tools@latest deploy --only firestore --project foodstock-manager-e33ed --token "$FIREBASE_TOKEN"

      - name: Explain missing Firebase token
        if: ${{ secrets.FIREBASE_TOKEN == '' }}
        run: |
          echo "FIREBASE_TOKEN is not configured."
          echo "Add the FIREBASE_TOKEN GitHub Actions secret, then run this workflow again."
          exit 1
